[package]
name = "matchum"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance spell checker compatible with cspell"

[lib]
path = "src/lib.rs"

[[bin]]
name = "matchum"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
matchum-core = { workspace = true }
matchum-dict = { workspace = true }
matchum-config = { workspace = true, features = ["fetch"] }
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
clap = { workspace = true }
ignore = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
json5 = { workspace = true }
compact_str = { workspace = true }
md-5 = { workspace = true }
memmap2 = { workspace = true }
unicode-normalization = { workspace = true }
unidiff = { workspace = true }
gix-attributes = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
