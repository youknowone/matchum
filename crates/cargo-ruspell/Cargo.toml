[package]
name = "cargo-ruspell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cargo subcommand for spell-checking Rust projects"

[[bin]]
name = "cargo-ruspell"
path = "src/main.rs"

[dependencies]
ruspell = { path = "../ruspell" }
ruspell-config = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
