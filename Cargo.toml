[package]
name = "ruspell-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    "crates/ruspell-core",
    "crates/ruspell-dict",
    "crates/ruspell-config",
    "crates/ruspell-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# Pattern matching
regex = "1"

# File scanning
ignore = "0.4"
globset = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Performance
hashbrown = "0.15"
foldhash = "0.1"
rayon = "1"

# Compression
flate2 = "1"

# Network / archive
ureq = "3"
tar = "0.4"

# Unicode
unicode-xid = "0.2"

# Hashing
md-5 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Testing
insta = "1"

# Internal crates
ruspell-core = { path = "crates/ruspell-core" }
ruspell-dict = { path = "crates/ruspell-dict" }
ruspell-config = { path = "crates/ruspell-config" }

[dev-dependencies]
ruspell-core = { workspace = true }
ruspell-dict = { workspace = true }
ruspell-config = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"

[profile.release]
debug = true
