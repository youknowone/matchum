[package]
name = "matchum-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
default-members = ["crates/matchum"]
members = [
    "crates/matchum-core",
    "crates/matchum-dict",
    "crates/matchum-config",
    "crates/matchum",
    "crates/cargo-matchum",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# Pattern matching
regex = "1"

# File scanning
ignore = "0.4"
globset = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Performance
hashbrown = "0.16"
foldhash = "0.1"
rayon = "1"
memmap2 = "0.9"
compact_str = "0.8"

# Compression
flate2 = "1"

# Network / archive
ureq = "3"
tar = "0.4"

# Unicode
unicode-xid = "0.2"
unicode-normalization = "0.1"

# Hashing
md-5 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Config formats
toml = "0.8"

# Testing
insta = "1"

# Internal crates
matchum-core = { path = "crates/matchum-core" }
matchum-dict = { path = "crates/matchum-dict" }
matchum-config = { path = "crates/matchum-config" }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
matchum-core = { workspace = true }
matchum-dict = { workspace = true }
matchum-config = { workspace = true }
compact_str = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
insta = { workspace = true }
globset = { workspace = true }
