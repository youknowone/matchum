[workspace]
default-members = ["crates/matchum"]
members = [
    "crates/matchum",
    "crates/matchum-core",
    "crates/matchum-dict",
    "crates/matchum-config",
    "crates/matchum-wasm",
    "crates/matchum-tests",
    "crates/cargo-matchum",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.91"
repository = "https://github.com/youknowone/matchum"
homepage = "https://github.com/youknowone/matchum"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# Pattern matching
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"

# File scanning
ignore = "0.4"
globset = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Performance
hashbrown = "0.16"
foldhash = "0.1"
rayon = "1"
memmap2 = "0.9"
compact_str = "0.8"
papaya = "0.2.3"

# Compression
flate2 = "1"

# Network / archive
ureq = "3"
tar = "0.4"

# Unicode
unicode-xid = "0.2"
unicode-normalization = "0.1"
unicode-general-category = "1.1.0"
unicase = "2.9.0"

# Hashing
md-5 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Config formats
toml = "0.8"
serde_yaml = "0.9"

# Spelling
typos-dict = "0.13.22"

# Allocators
mimalloc = { version = "0.1", default-features = false }
tikv-jemallocator = "0.6"

# Git
gix-attributes = "0.27.0"
unidiff = "0.4.0"

# Wasm
wasm-bindgen = "0.2"
js-sys = "0.3"

# Testing
insta = "1"
tempfile = "3"

# Internal crates
matchum = { version = "0.0.1", path = "crates/matchum" }
matchum-core = { version = "0.0.1", path = "crates/matchum-core" }
matchum-dict = { version = "0.0.1", path = "crates/matchum-dict" }
matchum-config = { version = "0.0.1", path = "crates/matchum-config", default-features = false }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
