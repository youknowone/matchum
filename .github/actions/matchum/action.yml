name: 'matchum'
description: 'Spell check with matchum. Supports full-project and diff-only modes.'

inputs:
  version:
    description: 'matchum version to install (cargo-binstall tag or "latest")'
    required: false
    default: 'latest'
  config:
    description: 'Path to cspell.json config file'
    required: false
    default: ''
  paths:
    description: 'Paths to check (space-separated)'
    required: false
    default: '.'
  diff_base:
    description: 'Git ref to diff against. Set empty to check all files.'
    required: false
    default: ''
  strict:
    description: 'Fail the workflow if spelling issues are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install matchum
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if command -v cargo-binstall &> /dev/null; then
          if [ "$VERSION" = "latest" ]; then
            cargo binstall --no-confirm matchum
          else
            cargo binstall --no-confirm "matchum@$VERSION"
          fi
        else
          # Fallback: install cargo-binstall first, then use it
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          if [ "$VERSION" = "latest" ]; then
            cargo binstall --no-confirm matchum
          else
            cargo binstall --no-confirm "matchum@$VERSION"
          fi
        fi

    - name: Fetch diff base
      shell: bash
      if: inputs.diff_base != ''
      env:
        DIFF_BASE: ${{ inputs.diff_base }}
      run: |
        git fetch origin "$DIFF_BASE" || true

    - name: Run matchum
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_DIFF_BASE: ${{ inputs.diff_base }}
      run: |
        ARGS="check $INPUT_PATHS --format github"
        if [ "$INPUT_STRICT" = "true" ]; then
          ARGS="$ARGS --strict"
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS="$ARGS --config $INPUT_CONFIG"
        fi

        if [ -n "$INPUT_DIFF_BASE" ]; then
          git diff "${INPUT_DIFF_BASE}...HEAD" | matchum $ARGS --diff
        else
          matchum $ARGS
        fi
